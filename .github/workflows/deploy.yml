name: Validate and deploy Pages

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  CF_PAGES: '1'
  CF_PAGES_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build with outbound networking blocked in Node
        run: npm run build
        env:
          NODE_OPTIONS: --import=./scripts/offline-build-guard.mjs
      - name: Install the browser test dependency
        run: npx playwright install --with-deps chromium
      - name: Six real console missions under the existing CSP
        env:
          QA_PORT: '4332'
          QA_BASE_URL: http://127.0.0.1:4332
          QA_OUTPUT: artifacts/real-logic-console/ci
        run: |
          node scripts/qa-server.mjs > /tmp/mule-console-qa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/real-logic-console-qa.mjs
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-logic-console-browser
          path: |
            artifacts/real-logic-console/ci/*.json
            artifacts/real-logic-console/ci/*.png
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy Pages
    # Codex branches are for review only and must never deploy to Cloudflare.
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/codex/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy production or branch preview
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.148.0'
          # Wrangler reads the checked-out Git branch; main is the Pages production branch.
          command: pages deploy dist --project-name=mule-site
      - name: Deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PREVIEW_ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          printf 'Deployment: %s\nBranch alias: %s\n' "$DEPLOYMENT_URL" "$PREVIEW_ALIAS" >> "$GITHUB_STEP_SUMMARY"
